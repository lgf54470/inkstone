name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: node scripts/ci-bench-report.mjs
      - run: npm run i18n:check
      - run: npm run comments:check
      - run: npm run module-state:check
      - run: npm run size:check
      - run: npm run build
      - run: node scripts/check-bundle-budget.mjs
      - run: npm run vendor:check

      - name: End-to-end against a local dev server
        timeout-minutes: 15
        run: |
          INKSTONE_EPHEMERAL_DEV=1 npm run dev:kv > /tmp/inkstone-dev.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 120); do
            if curl -sf http://localhost:7712/ > /dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat /tmp/inkstone-dev.log; exit 1; fi
          node scripts/e2e.mjs

  blog-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build