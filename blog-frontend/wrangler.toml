#:schema node_modules/wrangler/config-schema.json
name = "inkstone-blog"
compatibility_date = "2026-05-01"

# sanitize-html 依赖 postcss（style 白名单解析），postcss 顶层引用 node 内置模块，
# 无此标志 Worker 加载 SSR 模块会直接失败
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers 现代静态资产托管（Workers Static Assets）
# Astro 构建产物输出目录为 ./dist
[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

[vars]
# 后端 Inkstone Worker 服务的生产域名（例如：https://inkstone.your-domain.workers.dev）
# 部署后可在 Cloudflare Dashboard 或此处配置
PUBLIC_API_URL = "https://inkstone.333096.xyz"
